<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بررسی تصاویر تمام محصولات</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
    h1 { text-align: center; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
    .card h3 { margin: 0 0 4px 0; font-size: 16px; color: #38bdf8; }
    .card .meta { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    .images { display: flex; gap: 8px; }
    .img-box { flex: 1; text-align: center; }
    .img-box img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background: #334155; }
    .img-box span { display: block; font-size: 10px; color: #cbd5e1; margin-top: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>بررسی تصاویر تمامی ۶۲ محصول</h1>
  <div class="grid" id="grid"></div>

  <script type="module">
    import { PRODUCTS } from '/src/js/data/products.js';

    const container = document.getElementById('grid');
    PRODUCTS.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${p.slug}`;
      const img1 = p.images?.[0] || `/images/products/${p.slug}.jpg`;
      const img2 = p.images?.[1] || `/images/products/${p.slug}-2.jpg`;

      card.innerHTML = `
        <h3>${idx + 1}. ${p.name}</h3>
        <div class="meta">${p.slug} | دسته‌بندی: ${p.category} | جنس: ${p.material || '-'}</div>
        <div class="images">
          <div class="img-box">
            <img src="${img1}" loading="lazy" alt="${p.name} 1">
            <span>${img1.split('/').pop()}</span>
          </div>
          <div class="img-box">
            <img src="${img2}" loading="lazy" alt="${p.name} 2">
            <span>${img2.split('/').pop()}</span>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
