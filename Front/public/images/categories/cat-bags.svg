<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 735" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgBags" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#eceff3"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2b47"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="735" fill="url(#bgBags)"/>

  <!-- Decorative -->
  <circle cx="200" cy="180" r="160" fill="#3157d5" opacity="0.08"/>
  <circle cx="900" cy="580" r="130" fill="#172033" opacity="0.06"/>

  <!-- Handbag centered -->
  <g transform="translate(550, 380)">
    <!-- Handle -->
    <path d="M -130 -180 Q -130 -260 -70 -260 L 70 -260 Q 130 -260 130 -180"
          stroke="#172033" stroke-width="14" fill="none" stroke-linecap="round"/>

    <!-- Bag body -->
    <path d="M -200 -160 L 200 -160 L 220 200 Q 220 240 180 240 L -180 240 Q -220 240 -220 200 Z"
          fill="url(#bagGrad)"/>

    <!-- Top flap -->
    <path d="M -200 -160 L 200 -160 L 210 -110 L -210 -110 Z" fill="#3157d5"/>

    <!-- Center clasp -->
    <rect x="-30" y="-130" width="60" height="40" rx="6" fill="#ffffff"/>
    <rect x="-20" y="-122" width="40" height="24" rx="3" fill="#3157d5"/>
    <circle cx="0" cy="-110" r="6" fill="#ffffff"/>

    <!-- Side stitching -->
    <line x1="-180" y1="-140" x2="-180" y2="220" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,4"/>
    <line x1="180" y1="-140" x2="180" y2="220" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,4"/>

    <!-- Bottom shadow -->
    <ellipse cx="0" cy="260" rx="220" ry="20" fill="#172033" opacity="0.15"/>

    <!-- Subtle highlight -->
    <path d="M -160 -150 L -150 220" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  </g>

  <!-- Label -->
  <text x="550" y="640" font-family="Vazirmatn, Tahoma, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="middle">کیف</text>
  <line x1="470" y1="680" x2="630" y2="680" stroke="#3157d5" stroke-width="2"/>
</svg>