<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#1f2b47"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3157d5"/>
      <stop offset="100%" stop-color="#5c79e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgHero)"/>

  <!-- Geometric decorative shapes -->
  <circle cx="100" cy="80" r="60" fill="#3157d5" opacity="0.15"/>
  <circle cx="700" cy="420" r="90" fill="#3157d5" opacity="0.1"/>
  <rect x="600" y="50" width="120" height="120" fill="#ffffff" opacity="0.04" rx="20"/>
  <rect x="80" y="320" width="80" height="80" fill="#ffffff" opacity="0.05" rx="12"/>

  <!-- Diagonal accent line -->
  <line x1="0" y1="180" x2="800" y2="350" stroke="#3157d5" stroke-width="1" opacity="0.2"/>

  <!-- Small fashion icons scattered -->
  <!-- Dress silhouette icon top right -->
  <g transform="translate(640, 100)" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.25">
    <circle cx="0" cy="-12" r="6"/>
    <path d="M -8 -2 L 8 -2 L 14 30 L -14 30 Z"/>
  </g>

  <!-- Shoe icon bottom right -->
  <g transform="translate(680, 380)" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.25">
    <path d="M -20 0 Q -22 -8 -10 -12 L 14 -10 Q 22 -8 22 0 Q 22 5 18 5 L -18 5 Q -22 5 -22 0 Z"/>
    <line x1="-15" y1="-5" x2="15" y2="-5"/>
  </g>

  <!-- Bag icon top left -->
  <g transform="translate(160, 140)" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.25">
    <path d="M -16 -10 Q -16 -20 -8 -20 L 8 -20 Q 16 -20 16 -10"/>
    <rect x="-18" y="-10" width="36" height="28" rx="2"/>
  </g>

  <!-- Glasses icon bottom left -->
  <g transform="translate(180, 380)" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.25">
    <circle cx="-8" cy="0" r="8"/>
    <circle cx="8" cy="0" r="8"/>
    <line x1="-1" y1="0" x2="1" y2="0"/>
  </g>

  <!-- Main title with Persian text -->
  <text x="400" y="220" font-family="Vazirmatn, Tahoma, sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle">دنیای مد</text>
  <text x="400" y="290" font-family="Vazirmatn, Tahoma, sans-serif" font-size="32" font-weight="500" fill="#a8a7d8" text-anchor="middle">یک انتخاب برای هر لحظه</text>

  <!-- Accent divider -->
  <line x1="320" y1="240" x2="480" y2="240" stroke="url(#accentGrad)" stroke-width="3"/>

  <!-- CTA-style category list at bottom -->
  <g transform="translate(400, 380)">
    <text x="0" y="0" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.85">
      زنانه · مردانه · کفش · کیف · اکسسوری
    </text>
  </g>

  <!-- Brand mark bottom corner -->
  <g transform="translate(400, 450)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#3157d5" stroke-width="2"/>
    <text x="0" y="22" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="2">MODSTYLE</text>
  </g>
</svg>