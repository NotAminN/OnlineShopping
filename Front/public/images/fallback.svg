<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="50%" stop-color="#1b2538"/>
      <stop offset="100%" stop-color="#111723"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3157D5"/>
      <stop offset="100%" stop-color="#A8A7D8"/>
    </linearGradient>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#ffffff" opacity="0.04"/>
      <circle cx="12" cy="8" r="0.6" fill="#ffffff" opacity="0.03"/>
      <circle cx="7" cy="16" r="0.8" fill="#ffffff" opacity="0.04"/>
      <circle cx="17" cy="14" r="0.5" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grain)"/>
  
  <!-- Subtle border frame -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="32" y="32" width="536" height="736" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  
  <!-- Center Emblem -->
  <g transform="translate(300, 370)">
    <!-- Decorative diamond -->
    <path d="M 0 -70 L 50 0 L 0 70 L -50 0 Z" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="32" fill="#1b2538" stroke="#3157D5" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Hanger Icon -->
    <path d="M 0 -14 C 4 -14 7 -11 7 -7 C 7 -3 4 -1 0 3 L -18 14 L 18 14 Z" 
          fill="none" stroke="#A8A7D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Brand Typography -->
    <text y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#f8fafc" opacity="0.9">MOD STYLE</text>
    <text y="138" text-anchor="middle" font-family="'Vazirmatn', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#A8A7D8" opacity="0.7">مجموعه مد و استایل پریمیوم</text>
  </g>
</svg>
